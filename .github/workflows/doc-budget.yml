name: Agentic flow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agentic-flow:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Assert agentic flow (fail-closed)
        shell: pwsh
        env:
          # Doc-sync base: a push compares against the previous head; a pull request uses
          # GITHUB_BASE_REF (origin/<base>), which fetch-depth: 0 makes available.
          DOCSYNC_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: ./scripts/ticket/Assert-AgenticFlow.ps1

      - name: Script Pester tests
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.9.1
          Invoke-Pester ./scripts -Output Detailed -CI

      # Error and Warning both fail the job (settings: PSScriptAnalyzerSettings.psd1).
      - name: PSScriptAnalyzer (fails on Warning)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.25.0
          $found = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $found | Format-Table -AutoSize RuleName, Severity, ScriptName, Line | Out-String -Width 200 | Write-Host
          Write-Host "PSScriptAnalyzer: $($found.Count) finding(s)"
          if ($found.Count) { exit 1 }

      - name: Assert-TicketArtifacts fixture checks
        shell: pwsh
        run: |
          $fixture = './scripts/ticket/fixtures'
          ./scripts/ticket/Assert-TicketArtifacts.ps1 -Ticket WI00001 -Phase start    -Root $fixture
          ./scripts/ticket/Assert-TicketArtifacts.ps1 -Ticket WI00001 -Phase implement -Root $fixture
          ./scripts/ticket/Assert-TicketArtifacts.ps1 -Ticket WI00001 -Phase close    -Root $fixture

      # Every *.test.js runs, so a new test file cannot be left out of CI. Each file is
      # its own runner (not node:test), hence one node process per file.
      - name: Hook tests (core, Cursor and Claude bridges)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem hooks/tests, adapters/claude/hooks/tests -Filter *.test.js | Sort-Object FullName)
          if (-not $files.Count) { throw 'No hook test files found' }
          $failed = @()
          foreach ($f in $files) {
            Write-Host "== $($f.Name)"
            node $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $f.Name }
          }
          if ($failed.Count) { throw "Hook tests failed: $($failed -join ', ')" }
