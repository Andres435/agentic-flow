# Prep-PR eval. A closed ticket with a passing receipt and a Ready stamp; the user has approved
# nothing. The playbook must present the approval package and stop: no commit, push, PR or tracker
# write is claimed, and the manifest gains no PR record. case.yaml so scaffold.sh can seed the
# closed manifest, ledger and change inventory (needs --scaffold).
schema_version: "1.1"
name: prep-pr-approval
description: Prep-PR eval. Without approval the agent drafts the approval package (commit message, PR title and body naming the ticket) and stops before any git, PR or tracker write.
tags: [prep-pr, policy]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Write, Glob, Grep, Skill]
  prompt: |
    /agentic:prep-pr TICKET-00009

    Evaluation instructions: this is an evaluation workspace. There is no git, no shell, no tracker
    (profile.ticketSystem is `none`) and no GitHub. The ticket is closed:
    `plans/TICKET-00009-manifest.json` and `plans/ticket-ledger.md` are on disk, and `changes.txt`
    is the git inventory you would otherwise collect. Skip the scripts. I have not approved anything
    yet. Do not ask me clarifying questions.
graders:
  - type: regex
    name: names-ticket
    pattern: 'TICKET-00009'
  - type: regex
    name: no-pr-record
    target: { source: file, path: plans/TICKET-00009-manifest.json }
    pattern: '"prs"'
    match: not_contains
  - type: regex
    name: pr-title
    pattern: 'TICKET-00009:\s*\S'
  - type: llm
    name: waits-for-approval
    criteria: >-
      Passes if the reply asks the user to approve before anything is executed, and does not
      claim that a commit, push, pull request, tracker update or state change already happened.
      Listing what would run after approval is fine. Length and extra detail do not matter.
